name: Nix checks

on: [push]

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    name: Flake checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      # --impure because the devenv-based devShells cannot be evaluated
      # purely, and `nix flake check` evaluates every flake output.
      - name: Flake check
        run: nix flake check --impure --no-update-lock-file

      - name: Verify devenv shell builds
        run: nix develop --impure --command node --version

      - name: Build for browser properties
        run: nix develop --impure --command npm run build

      - name: Bombadil browser properties
        run: nix develop --impure --command npm run test:bombadil

      - name: Upload Bombadil trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bombadil-trace
          path: tmp/bombadil-*/trace.bin
          if-no-files-found: ignore
