name: Nix checks

on: [push]

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    name: Flake checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      # --impure because the devenv-based devShells cannot be evaluated
      # purely, and `nix flake check` evaluates every flake output.
      - name: Flake check
        run: nix flake check --impure --no-update-lock-file

      - name: Verify devenv shell builds
        run: nix develop --impure --command node --version
